<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI in der Pflege – Virtueller Raum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: sachlich und ruhig, wie eine Fortbildung einer Klinik
   IDEA: ein flach gezeichnetes Pflegezimmer, jedes Möbel ist ein Thema
   PICTURE: Raum in Frontansicht mit Whiteboard, Schreibtisch, Bett, Roboter, Regal und Bild
   COLOUR and TYPE: Klinikweiß, helles Eichenholz, Petrol als Akzent; IBM Plex Sans
   LAYOUT: Kopfzeile mit Forscherfrage, Raum, feste Themenleiste unten, Infotafel rechts bzw. von unten */
:root{color-scheme:light dark;
--bg:light-dark(#e9edec,#0f1617);--card:light-dark(#ffffff,#162022);--ink:light-dark(#1b2629,#e6eeee);--soft:light-dark(#566468,#9fb0b2);
--line:light-dark(#dde3e3,#263336);--acc:light-dark(#1d6b70,#4fb3b5);--acc-bg:light-dark(#e8f2f2,#1b3133)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip;padding-bottom:96px}
h1,h2,h3{font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
header{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,16px) 16px;display:flex;flex-wrap:wrap;gap:14px 32px;justify-content:space-between;align-items:end}
h1{font-size:clamp(26px,3.6vw,42px)}
.fq{margin:10px 0 0;max-width:68ch;color:var(--soft)}
.fq b{color:var(--ink);font-weight:500}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft);min-width:200px}
.bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
.stage{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.stage svg{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 20px 50px -28px #0006;background:#f1f0eb}
.hs{cursor:pointer;outline:none}
.hs:hover .obj,.hs:focus-visible .obj{filter:brightness(1.05) drop-shadow(0 0 12px #1d6b7066)}
.pin circle{fill:#1d6b70;stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font:600 17px "IBM Plex Sans",sans-serif;text-anchor:middle;dominant-baseline:central}
.pin .pl rect{fill:#fff;stroke:#dde3e3}
.pin .pl text{fill:#1b2629;font:500 15px "IBM Plex Sans",sans-serif;text-anchor:start}
.hs.done .pin circle{fill:#fff;stroke:#1d6b70}.hs.done .pin>text{fill:#1d6b70}
.hs:focus-visible .pin circle{stroke:#e8a33d;stroke-width:5}
.halo{fill:#1d6b70;opacity:.3;transform-box:fill-box;transform-origin:center;animation:p 2.4s infinite}
.hs.done .halo{display:none}
@keyframes p{0%{transform:scale(1);opacity:.35}100%{transform:scale(2);opacity:0}}
.dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1000px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px -20px #0007;z-index:7}
.chip{min-height:52px;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink);font:500 14.5px/1.2 "IBM Plex Sans",sans-serif;text-align:left;cursor:pointer}
.chip:hover{background:var(--acc-bg)}
.chip .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--acc);color:var(--acc);font-size:13.5px;font-weight:600}
.chip.done .n{background:var(--acc);color:#fff}
.chip.on{border-color:var(--acc);background:var(--acc-bg)}
.chip:focus-visible,.x:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.scrim{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.panel{position:fixed;top:16px;right:16px;bottom:96px;width:min(500px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -24px #0008;overflow-y:auto;transform:translateX(calc(100% + 40px));transition:transform .35s ease;z-index:6}
.open .panel{transform:none}.open .scrim{opacity:1;pointer-events:auto}
.grab{display:none}.swipe{display:none;text-align:center;font-size:13px;color:var(--soft);margin:8px 0 0}
.ph{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:20px 22px 16px;display:flex;gap:14px;justify-content:space-between;align-items:start}
.ph small{display:block;color:var(--acc);font-weight:500;font-size:13.5px;margin-bottom:4px}
.ph h2{font-size:clamp(22px,2.6vw,28px)}
.x{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:22px;cursor:pointer}
.pb{padding:20px 22px 26px}
.pb p{margin:0 0 14px}.pb h3{font-size:17px;margin:20px 0 6px}.pb ul{margin:0 0 14px;padding-left:20px}.pb li{margin:4px 0}
.pb a{color:var(--acc)}
.free{min-height:46vh;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soft)}
.free b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.free small{font-size:13.5px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.btn{flex:1;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer}
.btn.f{background:var(--acc);border-color:var(--acc);color:#fff}
.btn[hidden]{display:none}
@media(max-width:700px){
 body{padding-bottom:110px}
 .stage{overflow-x:auto;padding:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}.stage::-webkit-scrollbar{display:none}
 .stage svg{width:860px;max-width:none;border-radius:0;box-shadow:none}
 .pin .pl{display:none}.pin{transform:scale(1.5);transform-box:fill-box;transform-origin:center}
 .swipe{display:block}
 .dock{gap:2px;padding:5px;grid-template-columns:repeat(5,minmax(0,1fr))}
 .chip{flex-direction:column;justify-content:center;gap:4px;padding:6px 2px;min-height:64px;font-size:12.5px;text-align:center;hyphens:auto;overflow-wrap:anywhere}
 .panel{top:auto;left:0;right:0;bottom:0;width:100%;height:80%;border-radius:20px 20px 0 0;border-bottom:0;transform:translateY(105%);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 .grab{display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0}
 .ph{padding:10px 16px 12px}.ph h2{font-size:21px}.pb{padding:16px 16px 26px}.free{min-height:34vh}}
@media(prefers-reduced-motion:reduce){.halo{animation:none}.panel,.scrim,.bar i{transition:none}}
</style>
</head>

<script>
{
/* =====================================================================
   HIER EUREN TEXT EINTRAGEN
   Bei "text" zwischen die beiden Backticks ` ` schreiben.
   Einfache HTML-Tags gehen: <p>Absatz</p>, <h3>Zwischenüberschrift</h3>,
   <ul><li>Punkt</li></ul>, <a href="https://...">Quelle</a>
   Solange "text" leer ist, wird die freie Fläche angezeigt.
   ===================================================================== */
const THEMEN=[
 {kurz:"Ausgangslage", titel:"Ausgangslage",
  text:``},
 {kurz:"KI heute", titel:"Was KI schon übernehmen kann",
  text:``},
 {kurz:"Zukunft", titel:"Was KI in Zukunft übernehmen kann – und was nicht",
  text:``},
 {kurz:"Recht", titel:"Rechtliche Rahmenbedingungen",
  text:``},
 {kurz:"Philosophie", titel:"Philosophisch gesehen",
  text:``}
];
/* ===================================================================== */

const $=id=>document.getElementById(id);const seen=new Set();let cur=-1,last=null;const N=THEMEN.length;
function dock(){$("dock").innerHTML=THEMEN.map((t,i)=>`<button class="chip${seen.has(i)?" done":""}${i===cur?" on":""}" data-i="${i}" aria-label="Thema ${i+1}: ${t.titel}"><span class="n">${i+1}</span><span>${t.kurz}</span></button>`).join("");}
function prog(){$("pc").textContent=seen.size+" von "+N;$("pbar").style.width=seen.size/N*100+"%";
 document.querySelectorAll(".hs").forEach(h=>h.classList.toggle("done",seen.has(+h.dataset.i)));dock();}
function show(i){if(!document.body.classList.contains("open"))last=document.activeElement;cur=i;seen.add(i);prog();const t=THEMEN[i];
 $("pk").textContent="Thema "+(i+1)+" von "+N;$("pt").textContent=t.titel;
 $("ptext").innerHTML=t.text.trim()?t.text:`<div class="free"><div><b>Platz für euren Text</b><small>Inhalt folgt</small></div></div>`;
 $("prev").hidden=i===0;$("next").textContent=i<N-1?"Nächstes Thema":"Zurück zum Raum";
 document.body.classList.add("open");$("panel").scrollTop=0;$("x").focus();}
function hide(){document.body.classList.remove("open");cur=-1;dock();if(last&&last.focus)last.focus();}
